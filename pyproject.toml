[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyldl"
version = "0.1.3"
description = "AI tools"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    { name="Maxime BLIDI", email="blidi.maxime@gmail.com" }
]
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "python-dotenv>=1.0.0",
    "tqdm",
    "scikit-learn",
    "matplotlib",
    "torch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
all = ["pyldl[llm,cnn,vit]"]
llm = [
    "transformers",
    "datasets",
    "accelerate",
    "protobuf==5.28.2",
    "sentencepiece==0.2.0",
    "bitsandbytes==0.44.1",
    "peft",
    "trl",
]
cnn = [
    "torchvision"
]
vit = [
    "transformers",
    "datasets",
    "accelerate",
    "protobuf==5.28.2",
    "sentencepiece==0.2.0",
    "bitsandbytes==0.44.1",
]


[tool.setuptools.packages.find]
where = ["."]
